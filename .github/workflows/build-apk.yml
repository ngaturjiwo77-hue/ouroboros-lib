name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Buildozer & Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-dev build-essential
          sudo apt install -y autoconf automake libtool libffi-dev
          sudo apt install -y libssl-dev libncurses5-dev libsqlite3-dev
          sudo apt install -y libgmp-dev libmpfr-dev libmpc-dev
          pip install buildozer cython kivy

      - name: Create Kivy App
        run: |
          cat > main.py << 'APPEOF'
          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.uix.button import Button
          from kivy.uix.textinput import TextInput
          from kivy.uix.scrollview import ScrollView
          from ouroboros_lib import Ouroboros

          class OuroborosApp(App):
              def build(self):
                  self.layout = BoxLayout(orientation='vertical', padding=10, spacing=10)
                  self.layout.add_widget(Label(text='Ouroboros Scanner', font_size=24, size_hint=(1, 0.1)))
                  
                  self.input = TextInput(
                      hint_text='Paste code here...',
                      font_size=14,
                      size_hint=(1, 0.4),
                      background_color=(0.1, 0.1, 0.1, 1),
                      foreground_color=(0, 1, 0, 1)
                  )
                  self.layout.add_widget(self.input)
                  
                  btn = Button(
                      text='Scan for Voids',
                      size_hint=(1, 0.1),
                      background_color=(0, 0.5, 0, 1)
                  )
                  btn.bind(on_press=self.scan)
                  self.layout.add_widget(btn)
                  
                  self.output = Label(
                      text='Results will appear here...',
                      font_size=12,
                      size_hint=(1, 0.4),
                      color=(0, 1, 0, 1)
                  )
                  self.layout.add_widget(self.output)
                  
                  return self.layout

              def scan(self, instance):
                  code = self.input.text
                  if code.strip():
                      ouro = Ouroboros()
                      anchors, voids = ouro.scan(code)
                      result = f'Anchors: {len(anchors)}\nVoids: {len(voids)}\n\n'
                      for v in voids:
                          result += f'[!] {v.lokasi}: {v.deskripsi[:80]}\n'
                      self.output.text = result
                  else:
                      self.output.text = 'Please enter code to scan'

          OuroborosApp().run()
          APPEOF

      - name: Create Buildozer Config
        run: |
          cat > buildozer.spec << 'SPECEOF'
          [app]
          title = Ouroboros Scanner
          package.name = ouroboros
          package.domain = dev.ouroboros
          source.dir = .
          source.include_exts = py
          version = 1.0
          requirements = python3,kivy==2.3.0
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 31
          android.minapi = 21
          android.ndk = 25b
          android.sdk = 31
          android.gradle_dependencies = 
          SPECEOF

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/25.2.9519653
          yes | buildozer android debug || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ouroboros-apk
          path: bin/*.apk
