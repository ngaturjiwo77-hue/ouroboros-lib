name: Deploy Web App

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Create Web App
        run: |
          mkdir -p _site
          cp _site/scanner.js . 2>/dev/null || true
          cat > _site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Ouroboros Scanner</title>
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          body{background:#0a0a0a;color:#00ff41;font-family:monospace;padding:15px;max-width:800px;margin:0 auto}
          h1{text-align:center;margin:20px 0;text-shadow:0 0 20px #00ff41}
          textarea{width:100%;height:200px;background:#111;color:#0f0;border:1px solid #333;padding:10px;font-family:monospace;font-size:14px;border-radius:8px;margin:10px 0}
          button{background:#111;color:#0f0;border:1px solid #0f0;padding:10px 25px;border-radius:8px;cursor:pointer;font-family:monospace;font-size:14px;margin:5px}
          button:hover{background:#0f0;color:#000}
          pre{background:#111;border:1px solid #333;padding:15px;border-radius:8px;white-space:pre-wrap;margin:10px 0;max-height:400px;overflow-y:auto}
          .card{background:#111;border:1px solid #1a1a1a;border-radius:8px;padding:15px;margin:10px 0}
          </style>
          </head>
          <body>
          <h1>Ouroboros Scanner</h1>
          <div class="card">
          <h3>Paste Python/JS/Go/Java code:</h3>
          <textarea id="code" placeholder="Paste source code here...">import os
          def run(cmd):
              if cmd.startswith("ls"):
                  os.system(cmd)</textarea>
          <button onclick="scan()">Scan for Voids</button>
          </div>
          <pre id="output">Results will appear here...</pre>
          <script>
          // Ouroboros Scanner
          const VY = [
              {n:'exec/eval',p:/exec\s*\(|eval\s*\(/gi,c:'code_execution'},
              {n:'os.system',p:/os\.system\s*\(/gi,c:'command_execution'},
              {n:'subprocess',p:/subprocess\.(call|Popen|run)\s*\(/gi,c:'command_execution'},
              {n:'pickle',p:/pickle\.(load|loads)\s*\(/gi,c:'deserialization'},
              {n:'torch.load',p:/torch\.load\s*\(/gi,c:'deserialization'},
              {n:'joblib',p:/joblib\.load\s*\(/gi,c:'deserialization'},
              {n:'open(w)',p:/open\s*\([^)]*['"][wa]/gi,c:'file_operation'},
              {n:'socket',p:/\.connect\s*\(|socket\.socket\s*\(/gi,c:'network'},
              {n:'unquote',p:/unquote_plus\s*\(/gi,c:'decoding'},
              {n:'json.loads',p:/json\.loads\s*\(/gi,c:'deserialization'},
              {n:'Runtime.exec',p:/Runtime\.exec\s*\(/gi,c:'command_execution'},
          ];
          const WEAK = [
              {n:'startswith',p:/\.startswith\s*\(/gi,d:'startswith() can be bypassed with prefix injection'},
              {n:'endswith',p:/\.endswith\s*\(/gi,d:'endswith() can be bypassed with null byte/double extension'},
          ];
          function scan(){
              const c=document.getElementById('code').value;
              const o=document.getElementById('output');
              const l=c.split('\n');
              let r='PHASE 1: Anchoring (Vy)\n'+'='.repeat(40)+'\n\n';
              let a=[],v=[];
              l.forEach((ln,i)=>{
                  VY.forEach(x=>{if(x.p.test(ln)){a.push({l:i+1,n:x.n,c:x.c,cd:ln.trim()});r+='[Vy] L'+(i+1)+': '+x.n+' ('+x.c+')\n     '+ln.trim().substring(0,80)+'\n';}});
              });
              if(!a.length)r+='(No execution points found)\n';
              r+='\nPHASE 2: Back-Sweep (Voids)\n'+'='.repeat(40)+'\n\n';
              a.forEach(an=>{
                  for(let i=an.l-2;i>=Math.max(0,an.l-50);i--){
                      const ln=l[i]||'';
                      WEAK.forEach(w=>{if(w.p.test(ln)){v.push({l:i+1,n:w.n,d:w.d,cd:ln.trim(),vy:an});r+='[!] L'+(i+1)+': '+w.d+'\n     '+ln.trim().substring(0,80)+'\n     -> Leads to: '+an.n+' at L'+an.l+'\n';}});
                      if(/input\(|sys\.argv|request\.|\.get\(|recv\(|read\(/.test(ln)){r+='[->] L'+(i+1)+': Input source\n     '+ln.trim().substring(0,80)+'\n';break;}
                  }
              });
              if(!v.length)r+='(No voids found)\n';
              r+='\nSUMMARY\n'+'='.repeat(40)+'\n\n';
              r+='Anchors: '+a.length+' | Voids: '+v.length+'\n';
              const s=Math.max(0,1.0-(v.length*0.2));
              r+='Score: '+s.toFixed(2)+'/1.00\n';
              r+=s<0.5?'\nCRITICAL!':s<0.8?'\nWARNING':'';
              o.textContent=r;
          }
          window.onload=scan;
          </script>
          </body>
          </html>
          HTMLEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
